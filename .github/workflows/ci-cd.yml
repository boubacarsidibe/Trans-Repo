name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Run the deploy job after checks"
        required: false
        type: boolean
        default: false

jobs:
  frontend:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # Resolved from the repository root, not from working-directory.
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload frontend build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: ignore

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_trans

    # BackendTransApplicationTests is a @SpringBootTest and JPA runs with
    # ddl-auto=update, so Hibernate opens a real connection while the context
    # starts. These values match the defaults in application.properties, so no
    # environment override is needed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: Transdb
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secretpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Invoked through bash because mvnw is committed without the exec bit.
      - name: Build and test
        run: bash mvnw -B verify

      - name: Upload backend jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend_trans/target/*.jar
          if-no-files-found: ignore

      # jacoco-maven-plugin (pom.xml) genere ce rapport via son execution
      # "report", liee par defaut a la phase verify deja lancee ci-dessus.
      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend_trans/target/site/jacoco/
          if-no-files-found: ignore

  agent:
    name: Agents (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r system/requirements.txt -r network/requirements.txt

      # No test suite yet: compileall catches syntax errors and, combined with
      # the install step above, missing dependencies.
      - name: Syntax check
        run: python -m compileall -q system network

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [frontend, backend, agent]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    steps:
      - uses: actions/checkout@v4

      - name: Deploy placeholder
        run: |
          echo "Configure your deployment target here."
          echo "Examples: Azure, Vercel, Netlify, Docker, Kubernetes, or a custom server."
          echo "This job currently validates the CD stage is wired, but does not deploy yet."
