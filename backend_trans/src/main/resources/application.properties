spring.application.name=backend_trans

logging.level.root=INFO

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Transdb}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:secretpassword}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B59702345604E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}

security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
security.login.lockout-minutes=${LOGIN_LOCKOUT_MINUTES:15}

# Origines autorisees pour l'API REST et le canal WebSocket. Une seule source de
# verite : le deploiement conteneurise (specs 12.3) surcharge par variable.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Diffusion temps reel (specs 8). Au-dela de ces limites la session est fermee
# plutot que de laisser un client lent retenir la memoire du serveur.
app.websocket.send-time-limit-ms=${WS_SEND_TIME_LIMIT_MS:5000}
app.websocket.buffer-size-limit-bytes=${WS_BUFFER_SIZE_LIMIT_BYTES:524288}

# Frequence de collecte de reference des agents (cahier des charges F3/F4 : 60 s).
app.collecte.intervalle-secondes=${COLLECTE_INTERVALLE_SECONDES:60}

# Trois cycles de silence declarent l'equipement indisponible (regles F3 et F4).
app.watchdog.cycles-toleres=${WATCHDOG_CYCLES_TOLERES:3}
app.watchdog.periode-ms=${WATCHDOG_PERIODE_MS:30000}

# Notifications e-mail (F7). Desactivees par defaut : sans serveur SMTP declare,
# la plateforme doit demarrer et superviser normalement.
app.notifications.email.actif=${NOTIFICATIONS_EMAIL_ACTIF:false}
app.notifications.email.expediteur=${NOTIFICATIONS_EMAIL_EXPEDITEUR:supervision@ept.sn}
# Rappel des alertes critiques non prises en charge (specs 11.4).
app.notifications.rappel-minutes=${NOTIFICATIONS_RAPPEL_MINUTES:60}
app.notifications.rappel-periode-ms=${NOTIFICATIONS_RAPPEL_PERIODE_MS:300000}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

# Rapports (F8) : repertoire des PDF generes et heure de la generation nocturne.
app.rapports.repertoire=${RAPPORTS_REPERTOIRE:./rapports}
app.rapports.cron-journalier=${RAPPORTS_CRON_JOURNALIER:0 15 1 * * *}

# Retention et agregation des metriques (specs 6.10).
app.retention.metriques-brutes-jours=${RETENTION_BRUTES_JOURS:90}
app.retention.horaire-mois=${RETENTION_HORAIRE_MOIS:12}
app.retention.cron=${RETENTION_CRON:0 30 2 * * *}

