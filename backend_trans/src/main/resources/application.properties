spring.application.name=backend_trans

logging.level.root=INFO

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Transdb}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:secretpassword}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:change-this-secret-key-change-this-secret-key-123456}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

